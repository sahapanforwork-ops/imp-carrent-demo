<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>เดโมหลังบ้าน IMP CarRent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
/* IMP CarRent หลังบ้าน
   แนวคิด: รถ 10 คันคือตัวเอก (ป้ายทะเบียนไทย) · "วันนี้" มาก่อน · อ่านออกกลางแดด · สีใช้บอกสถานะเท่านั้น */
:root {
  --asphalt: #e9ecef;      /* พื้นหลัง เทาถนน */
  --asphalt-2: #dfe3e7;
  --surface: #ffffff;
  --ink: #14181f;
  --ink-2: #3a424e;
  --muted: #5d6673;
  --rule: #d3d8de;
  --volt: #cff24b;         /* สีแบรนด์ ใช้กับ "รถว่าง" และปุ่มหลักปุ่มเดียว */
  --volt-ink: #3d5200;
  --hold: #e8a317;   --hold-bg: #fdf1d6;
  --confirmed: #2f6fed; --confirmed-bg: #e3ecfd;
  --active: #1f9d55; --active-bg: #dcf3e5;
  --monthly: #7c5cd6; --monthly-bg: #ece6fb;
  --maint: #7b8594;  --maint-bg: #e8ebef;
  --bad: #d23f37;    --bad-bg: #fde4e2;
  --link: #2352d8;
  --focus: #2352d8;
  --r-sm: 8px; --r: 14px; --r-lg: 20px;
  --font-display: "Anuphan", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Anuphan", system-ui, -apple-system, "Segoe UI", sans-serif;
  --side: 232px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--asphalt); color: var(--ink); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.boot { padding: 48px; text-align: center; color: var(--muted); }
.num, .tbl td.num, b, strong { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- app shell */
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: 56px;
  padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; text-decoration: none; color: var(--ink); }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--volt); }
.brand-mark svg { width: 16px; height: 16px; }
.top .who { margin-left: auto; text-align: right; line-height: 1.25; font-size: 14px; }
.top .who small { display: block; color: var(--muted); font-size: 12px; }
.top .icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.top .icon-btn svg { width: 18px; height: 18px; }

nav.tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--rule); }
nav.tabs a { position: relative; flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--asphalt); }
nav.tabs a.more-only { display: none; }
nav.tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.more-sheet { position: fixed; z-index: 45; left: 8px; right: 8px; bottom: calc(70px + env(safe-area-inset-bottom)); padding: 8px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg); box-shadow: 0 18px 40px -12px rgba(20, 24, 31, .35); }
.more-sheet[hidden] { display: none; }
.more-sheet a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 600; }
.more-sheet a:hover, .more-sheet a[aria-current="page"] { background: var(--asphalt); }
.more-sheet svg { width: 20px; height: 20px; color: var(--muted); }

main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 120px; }
@media (min-width: 900px) {
  .top { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); height: auto; flex-direction: column; align-items: stretch;
    gap: 0; padding: 18px 14px; border-right: 1px solid var(--rule); border-bottom: 0; }
  .brand { padding: 0 6px 18px; }
  .top .who { order: 3; margin: auto 0 0; text-align: left; padding: 14px 6px 10px; border-top: 1px solid var(--rule); }
  .top .icon-btn { order: 4; width: 100%; height: 38px; display: flex; gap: 8px; justify-content: center; font-size: 14px; }
  .top .icon-btn::after { content: "ออกจากระบบ"; }
  nav.tabs { position: fixed; z-index: 31; top: 74px; left: 0; right: auto; bottom: auto; width: var(--side); display: grid; gap: 2px;
    justify-content: stretch; padding: 0 14px; background: transparent; border: 0; }
  nav.tabs a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font-size: 15px; justify-items: start; }
  nav.tabs a.more-only { display: flex; }
  nav.tabs a.more-btn { display: none; }
  nav.tabs .badge { position: static; margin-left: auto; }
  .more-sheet { display: none !important; }
  main { margin-left: var(--side); padding: 28px 32px 64px; }
}

/* ---------------------------------------------------------------- type + basics */
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
h2 { font-family: var(--font-display); font-size: 19px; line-height: 1.3; margin: 32px 0 12px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .sub { color: var(--muted); font-size: 15px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--rule); border-radius: var(--r); }
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 10px; }

/* ---------------------------------------------------------------- ป้ายทะเบียน (ตัวเอกของหน้า) */
.plate { display: inline-grid; min-width: 96px; padding: 3px 10px 2px; border: 2px solid var(--ink); border-radius: 6px; background: #fff;
  text-align: center; line-height: 1.05; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(20, 24, 31, .25); }
.plate b { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: .01em; }
.plate small { font-size: 10.5px; color: var(--ink-2); white-space: nowrap; }
.plate.sm { min-width: 76px; padding: 1px 7px 0; border-width: 1.5px; }
.plate.sm b { font-size: 14px; }
.plate.sm small { font-size: 9.5px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(20, 24, 31, .25); vertical-align: -1px; }

/* กระดานรถวันนี้ */
.board { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.slot { position: relative; display: grid; gap: 8px; padding: 12px 12px 10px; background: var(--surface); border-radius: var(--r);
  border: 1px solid var(--rule); text-decoration: none; color: inherit; overflow: hidden; }
.slot::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--st, var(--maint)); }
.slot .state { font-weight: 700; font-size: 14px; color: var(--st-ink, var(--ink)); }
.slot .who { font-size: 13px; color: var(--muted); min-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.free { --st: var(--volt); --st-ink: var(--volt-ink); background: linear-gradient(0deg, #fbfde9, #fff 60%); }
.slot.hold { --st: var(--hold); }
.slot.confirmed { --st: var(--confirmed); }
.slot.active { --st: var(--active); --st-ink: var(--active); }
.slot.monthly { --st: var(--monthly); --st-ink: var(--monthly); }
.slot.maintenance { --st: var(--maint); }
.slot.late { --st: var(--bad); --st-ink: var(--bad); }
.board-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.board-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }

/* งานวันนี้ */
.today-sum { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 20px; font-size: 15px; color: var(--ink-2); }
.today-sum b { font-family: var(--font-display); font-size: 20px; margin-right: 4px; }
.today-sum .alert b { color: var(--bad); }
.tasks { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--rule); border-radius: var(--r); }
.task .what { font-weight: 700; }
.task .what a { color: inherit; text-decoration: none; }
.task .meta { font-size: 14px; color: var(--muted); }
.task .go { display: flex; gap: 6px; }
.task.late { border-color: #f1b8b4; background: #fffafa; }
.kind { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--asphalt); color: var(--ink-2); white-space: nowrap; }
.kind.out { background: var(--confirmed-bg); color: var(--confirmed); }
.kind.in { background: var(--active-bg); color: var(--active); }
.kind.late, .kind.money { background: var(--bad-bg); color: var(--bad); }
.kind.req { background: var(--hold-bg); color: #8a5a00; }

/* ---------------------------------------------------------------- สถานะ */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--asphalt); color: var(--ink-2); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9; }
.pill.new, .pill.hold { background: var(--hold-bg); color: #8a5a00; }
.pill.contacted, .pill.confirmed { background: var(--confirmed-bg); color: var(--confirmed); }
.pill.active, .pill.paid { background: var(--active-bg); color: var(--active); }
.pill.monthly { background: var(--monthly-bg); color: var(--monthly); }
.pill.maintenance { background: var(--maint-bg); color: var(--maint); }
.pill.returned, .pill.converted { background: #eef1f3; color: var(--muted); }
.pill.due { background: var(--bad-bg); color: var(--bad); }
.pill.cancelled, .pill.rejected, .pill.spam, .pill.void { background: transparent; color: #8b939e; text-decoration: line-through; }
.pill.free { background: #f3fbd0; color: var(--volt-ink); }

/* ---------------------------------------------------------------- กล่อง รายการ ตาราง */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; }
.card + .card { margin-top: 12px; }
.list { display: grid; gap: 8px; }
.item { display: block; position: relative; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r);
  color: inherit; text-decoration: none; }
a.item:hover { border-color: var(--ink-2); }
.item .title, .item a.title { font-weight: 700; color: var(--ink); text-decoration: none; }
.item .line { margin-top: 2px; }
.item .meta { font-size: 14px; color: var(--muted); }
.item .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.req .quote { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--rule); background: #f7f8f9; border-radius: 0 8px 8px 0; font-size: 15px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; margin: 0; }
.kv dt { color: var(--muted); font-size: 14px; padding-top: 2px; }
.kv dd { margin: 0; }
.money-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; margin-top: 14px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.money-strip div { background: var(--surface); padding: 12px 14px; }
.money-strip span { display: block; font-size: 13px; color: var(--muted); }
.money-strip b { font-family: var(--font-display); font-size: 21px; }
.money-strip .owe b { color: var(--bad); }
.money-strip .ok b { color: var(--active); }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.tbl th, .tbl td { padding: 10px 14px; border-bottom: 1px solid #eceff2; text-align: left; vertical-align: middle; font-size: 15px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font-size: 13px; font-weight: 600; color: var(--muted); background: #f7f8f9; white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl tbody tr:hover { background: #fafbfc; }
.tbl .late { color: var(--bad); font-weight: 700; }
.scroll-x { overflow-x: auto; }
.search { max-width: 380px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--asphalt-2); }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 24, 31, .12); }

/* ---------------------------------------------------------------- ฟอร์ม ปุ่ม */
label.f { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
label.f > span { color: var(--ink); font-weight: 600; font-size: 15px; }
input, select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid #c9cfd6; border-radius: 10px; background: #fff; }
input:hover, select:hover, textarea:hover { border-color: #aab2bc; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(35, 82, 216, .15); }
input:disabled, select:disabled { background: #f1f3f5; color: #7b8594; }
input[type="checkbox"] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--ink); }
textarea { min-height: 84px; resize: vertical; }
fieldset { border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; margin: 0; }
legend { padding: 0 6px; font-size: 14px; color: var(--muted); }
.form { display: grid; gap: 14px; }
.form .two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 16px; border-radius: 11px;
  border: 1.5px solid #c9cfd6; background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; font-weight: 700; font-size: 15px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2a313c; }
.btn.brand { background: var(--volt); border-color: #b9dc35; color: var(--ink); }
.btn.danger { color: var(--bad); border-color: #efc2bf; }
.btn.danger:hover { background: var(--bad-bg); }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: 14px; border-radius: 9px; }
.btn.call { color: var(--active); border-color: #b5e3c6; }
.btn:disabled { opacity: .5; cursor: progress; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.total { font-family: var(--font-display); font-size: 18px; font-weight: 700; }

/* ---------------------------------------------------------------- ปฏิทินรถ */
.cal { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
.cal table { border-collapse: separate; border-spacing: 0; }
.cal th, .cal td { height: 44px; min-width: 34px; padding: 0; text-align: center; font-size: 12px; border-bottom: 1px solid #eef0f3; }
.cal th.car { position: sticky; left: 0; z-index: 2; min-width: 112px; padding: 0 10px; background: var(--surface); border-right: 1px solid var(--rule); text-align: left; }
.cal thead th { position: sticky; top: 0; z-index: 1; height: 48px; background: #f7f8f9; font-weight: 600; line-height: 1.15; color: var(--ink-2); }
.cal thead th.car { z-index: 3; }
.cal thead th.wkend { color: var(--bad); }
.cal thead th small { display: block; font-size: 10px; font-weight: 700; color: var(--muted); }
.cal thead th.today small { color: var(--volt); }
.cal thead th.today { background: var(--ink); color: #fff; border-radius: 0 0 8px 8px; }
.cal td { cursor: pointer; border-right: 1px solid #f3f4f6; }
.cal td:not(.b):hover { background: #f3fbd0; box-shadow: inset 0 0 0 2px var(--volt); }
.cal td.b { position: relative; padding: 6px 0; }
.cal td.b span { display: block; height: 30px; margin: 0 -1px; background: var(--bar); color: #fff; font-size: 12px; font-weight: 700; line-height: 30px;
  text-align: left; padding-left: 6px; white-space: nowrap; overflow: visible; }
.cal td.b.s span { position: relative; z-index: 1; margin-left: 3px; border-radius: 8px 0 0 8px; }
.cal td.b.e span { margin-right: 3px; border-radius: 0 8px 8px 0; }
.cal td.b.s.e span { border-radius: 8px; }
.cal td.b.hold { --bar: var(--hold); }
.cal td.b.hold span { color: #3d2a00; }
.cal td.b.confirmed { --bar: var(--confirmed); }
.cal td.b.active { --bar: var(--active); }
.cal td.b.monthly { --bar: var(--monthly); }
.cal td.b.maintenance { --bar: repeating-linear-gradient(135deg, #9aa3af 0 6px, #b6bdc6 6px 12px); }
.cal td.b:hover span { filter: brightness(1.08); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.legend i { display: inline-block; width: 18px; height: 10px; border-radius: 5px; margin-right: 6px; vertical-align: 0; }

/* ---------------------------------------------------------------- สถิติเว็บ (กราฟสีเดียว แท่งบาง ปลายมน 4px ชิดฐาน) */
.vchart { position: relative; padding: 18px 0 0; }
.vchart__max { position: absolute; top: 0; left: 0; font-size: 12px; color: var(--muted); }
.vchart__bars { display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid var(--rule); background:
  linear-gradient(to bottom, transparent calc(50% - .5px), #eef0f3 calc(50% - .5px), #eef0f3 calc(50% + .5px), transparent calc(50% + .5px)); }
.vchart__col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
.vchart__col i { display: block; width: 100%; max-width: 22px; margin: 0 auto; background: var(--ink-2); border-radius: 4px 4px 0 0; }
.vchart__col:hover i { background: var(--ink); }
.vchart__x { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 12px; align-items: center; font-size: 14px; }
.hbar__label { overflow: hidden; text-overflow: ellipsis; }
.hbar__track { height: 12px; border-radius: 0 4px 4px 0; background: #eef0f3; }
.hbar__track i { display: block; height: 100%; background: var(--ink-2); border-radius: 0 4px 4px 0; }
.hbar:hover .hbar__track i { background: var(--ink); }
.hbar__val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.hbar__val small { font-weight: 600; color: var(--muted); margin-left: 4px; }
.two-col { display: grid; gap: 0 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 760px) { .two-col { grid-template-columns: minmax(0, 1fr); } .hbar { grid-template-columns: minmax(90px, 42%) 1fr auto; } }
.tip { position: fixed; z-index: 120; pointer-events: none; max-width: 260px; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; }

/* ---------------------------------------------------------------- dialog + toast + login */
dialog#modal { width: min(600px, 100vw); max-height: 92vh; margin: auto auto 0; border: 0; border-radius: 22px 22px 0 0; padding: 0; }
@media (min-width: 700px) { dialog#modal { margin: auto; border-radius: 22px; } }
dialog#modal::backdrop { background: rgba(20, 24, 31, .5); }
#modal-body { padding: 22px 20px 24px; }
#modal-body h2 { margin: 0 0 16px; font-size: 22px; }
dialog[open] #modal-body { animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

const addDays = (iso, n) => { const d = parse(iso); d.setUTCDate(d.getUTCDate() + n); return fmt(d); };

const addMonths = (iso, n) => {
  const d = parse(iso);
  const day = d.getUTCDate();
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last));
  return fmt(t);
};

const thDate = (iso, year = true) => {
  if (!iso) return "-";
  const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);

/** วันคืนรถ + จำนวนหน่วย ให้ตรงกับที่ฐานข้อมูลคำนวณ */
function bookingPeriod(kind, start, { end, months } = {}) {
  if (!start) return { end: null, units: 0 };
  if (kind === "monthly") {
    const n = Math.max(1, parseInt(months, 10) || 1);
    return { end: addDays(addMonths(start, n), -1), units: n };
  }
  const e = end && end >= start ? end : start;
  return { end: e, units: daysBetween(start, e) + 1 };
}
const bookingTotal = (unitPrice, units, discount = 0) => Math.max(0, (Number(unitPrice) || 0) * (Number(units) || 0) - (Number(discount) || 0));

const BLOCKING = ["hold", "confirmed", "active"];

/** ปฏิทินรถ: แต่ละคัน -> ช่องวันละ 1 ช่อง {d, b (booking|null), first (วันแรกที่เห็นของ booking)} */
function calendarRows(cars, bookings, from, days) {
  const dates = Array.from({ length: days }, (_, i) => addDays(from, i));
  return cars.map((car) => {
    const mine = bookings.filter((b) => b.car_id === car.id && BLOCKING.includes(b.status));
    const cells = dates.map((d) => {
      const b = mine.find((x) => x.start_date <= d && d <= x.end_date) || null;
      return { d, b, first: !!b && (b.start_date === d || d === from) };
    });
    return { car, cells };
  });
}

    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    const body = openModal(`<h2>${esc(message)}</h2><form class="form" id="ask">
      ${input !== null ? `<textarea name="v">${esc(input)}</textarea>` : ""}
      <div class="row"><span class="spacer"></span><button type="button" class="btn" data-close>ยกเลิก</button>
      <button class="btn ${danger ? "danger" : "primary"}">${esc(ok)}</button></div></form>`);
    modal.addEventListener("close", () => finish(null), { once: true });
    const f = body.querySelector("#ask");
    f.addEventListener("submit", (e) => { e.preventDefault(); finish(input !== null ? f.v.value : true); closeModal(); });
    (f.v || f.querySelector(".btn:last-child")).focus();
  });
}
/** sessionStorage ที่ไม่พังในหน้าที่ถูกจำกัดสิทธิ์ (จำแค่ตัวกรองที่เลือก) */
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* ไม่จำก็ได้ */ } },
};
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
const pill = (cls, text) => `<span class="pill ${esc(cls)}">${esc(text)}</span>`;
const formData = (form) => Object.fromEntries(new FormData(form).entries());
const go = (hash) => { if (location.hash === hash) route(); else location.hash = hash; };
const callBtn = (phone) => (phone ? `<a class="btn small call" href="tel:${esc(phone)}">${ICON.phone}โทร</a>` : "");
const formFoot = (label) => `<div class="row" style="margin-top:4px"><span class="spacer"></span><button type="button" class="btn" data-close>ปิด</button><button class="btn primary">${label}</button></div>`;
async function withBusy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { fail(e); } finally { if (btn) btn.disabled = false; }
}
function seg(name, options, current) {
  return `<div class="seg" role="group" data-seg="${name}">${options.map(([v, label]) =>
    `<button type="button" data-v="${v}" aria-pressed="${v === current}">${label}</button>`).join("")}</div>`;
}
function bindSeg(main, name, key) {
  main.querySelector(`[data-seg="${name}"]`)?.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (b) { store.set(key, b.dataset.v); route(); }
  });
}

/** ย่อรูปจากกล้องมือถือก่อนอัปโหลด (ยาวสุด 1600px JPEG) ไฟล์อื่นอัปโหลดตามเดิม */
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 400_000) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.82));
    return blob ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}
async function upload(prefix, file) {
  const f = await shrinkImage(file);
  const ext = (f.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "bin";
  const path = `${prefix}/${crypto.randomUUID()}.${ext}`;
  await q(sb.storage.from("private-docs").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false }));
  return path;
}
async function openFile(path) {
  const w = window.open("", "_blank");
  try {
    const { signedUrl } = await q(sb.storage.from("private-docs").createSignedUrl(path, 60));
    if (w) w.location = signedUrl; else location.href = signedUrl;
  } catch (e) { if (w) w.close(); fail(e); }
}

/** สั่ง build เว็บใหม่ (สถานะรถบนหน้าเว็บ) หน่วง 20 วิ รวมหลายการแก้ไขเป็นครั้งเดียว */
function scheduleRebuild() {
  clearTimeout(S.rebuildTimer);
  S.rebuildTimer = setTimeout(rebuildNow, 20_000);
}
async function rebuildNow(manual = false) {
  clearTimeout(S.rebuildTimer);
  try {
    const { data, error } = await sb.functions.invoke("rebuild-site", { body: {} });
    if (error) throw error;
    if (manual || data?.queued) toast(data?.message || "สั่งอัปเดตเว็บแล้ว");
    if (data && data.queued === false) S.rebuildTimer = setTimeout(rebuildNow, 130_000);
  } catch (e) {
    if (manual) fail(e); else console.warn("rebuild-site", e);
  }
}

    if (act === "convert") return bookingForm({ request: r });
    if (act === "note") {
      const note = await ask("โน้ตสำหรับคำขอนี้", { input: r.staff_note || "", ok: "บันทึกโน้ต" });
      if (note === null) return;
      return withBusy(btn, async () => { await q(sb.from("booking_requests").update({ staff_note: note }).eq("id", id)); route(); });
    }
    if ((act === "rejected" || act === "spam") && !(await ask(act === "spam" ? "ทำเครื่องหมายว่าเป็นสแปม?" : "ไม่รับคำขอนี้?", { danger: true, ok: act === "spam" ? "เป็นสแปม" : "ไม่รับ" }))) return;
    withBusy(btn, async () => {
      await q(sb.from("booking_requests").update({ status: act, handled_by: S.session.user.id, handled_at: new Date().toISOString() }).eq("id", id));
      route();
    });
  });
};

// ---------------------------------------------------------------- ปฏิทินรถ
VIEWS.calendar = async function calendar(main) {
  const from = store.get("calFrom") || today();
  const DAYS = 45;
  const to = addDays(from, DAYS - 1);
  const rows = await q(sb.from("v_bookings").select("id,car_id,kind,status,start_date,end_date,customer_name,contract_no")
    .in("status", ["hold", "confirmed", "active"]).lte("start_date", to).gte("end_date", from));
  const grid = calendarRows(S.cars.filter((c) => c.active), rows, from, DAYS);
  const t = today();
  const head = grid.length ? grid[0].cells.map((c) => {
    const wd = weekday(c.d);
    const mon = c.d.slice(8) === "01" || c.d === from ? `<small>${thDate(c.d, false).split(" ")[1]}</small>` : "";
    return `<th class="${c.d === t ? "today" : ""} ${wd === 0 || wd === 6 ? "wkend" : ""}">${mon}${TH_WD[wd]}<br>${Number(c.d.slice(8))}</th>`;
  }).join("") : "";
  const body = grid.map(({ car, cells }) => `<tr><th class="car">${plate(car, true)}</th>${cells.map((c, i) => {
    if (!c.b) return `<td data-car="${car.id}" data-d="${c.d}" title="${thDate(c.d)} ว่าง แตะเพื่อจอง"></td>`;
    const cls = c.b.kind === "monthly" ? "monthly" : c.b.kind === "maintenance" ? "maintenance" : c.b.status;
    const last = i === cells.length - 1 || c.b.end_date === c.d;
    const label = c.first ? esc((c.b.customer_name || KIND_TH[c.b.kind]).split(" ")[0]) : "";
    return `<td class="b ${cls}${c.first ? " s" : ""}${last ? " e" : ""}" data-b="${c.b.id}" title="${esc(c.b.customer_name || KIND_TH[c.b.kind])} ${thDate(c.b.start_date)} ถึง ${thDate(c.b.end_date)} (${esc(STATUS_TH[c.b.status])})"><span>${label}</span></td>`;
  }).join("")}</tr>`).join("");
  main.innerHTML = `
  <div class="page-head"><div><h1>ปฏิทินรถ</h1><div class="sub">${thDate(from)} ถึง ${thDate(to)}</div></div>
    <div class="actions"><button class="btn small" data-nav="-30">‹ ก่อนหน้า</button><button class="btn small" data-nav="0">วันนี้</button>
    <button class="btn small" data-nav="30">ถัดไป ›</button><button class="btn small brand" data-new>+ จอง</button></div></div>
  <div class="legend"><span><i style="background:var(--hold)"></i>รอยืนยัน</span><span><i style="background:var(--confirmed)"></i>ยืนยันแล้ว</span>
    <span><i style="background:var(--active)"></i>กับลูกค้า</span><span><i style="background:var(--monthly)"></i>รายเดือน</span><span><i style="background:#a9b1bb"></i>ปิดซ่อม</span></div>
  <div class="cal"><table><thead><tr><th class="car">รถ</th>${head}</tr></thead><tbody>${body || `<tr><td class="empty">ยังไม่มีรถ ${isOwner() ? '<a href="#cars">เพิ่มรถ</a>' : ""}</td></tr>`}</tbody></table></div>
  <p class="hint" style="margin-top:10px">แตะช่องว่างเพื่อจองรถคันนั้นวันนั้น แตะแถบสีเพื่อดูการจอง</p>`;
  main.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-nav]");
    if (nav) { const n = Number(nav.dataset.nav); store.set("calFrom", n ? addDays(from, n) : today()); return route(); }
    if (e.target.closest("[data-new]")) return bookingForm({});
    const td = e.target.closest("td");
    if (!td) return;
    if (td.dataset.b) return go("#booking/" + td.dataset.b);
    if (td.dataset.car) bookingForm({ carId: Number(td.dataset.car), start: td.dataset.d });
  });
};

// ---------------------------------------------------------------- การจอง: รายการ
VIEWS.bookings = async function bookings(main) {
  const filter = store.get("bkFilter") || "open";
  let qry = sb.from("v_bookings").select("*").order("start_date", { ascending: filter === "open" }).limit(300);
  if (filter === "open") qry = qry.in("status", ["hold", "confirmed", "active"]);
  const rows = await q(qry);
  main.innerHTML = `
  <div class="page-head"><div><h1>การจอง / สัญญา</h1><div class="sub">${rows.length} รายการ</div></div>
    <div class="actions"><button class="btn brand" data-new>+ จองใหม่</button></div></div>
  <div class="filters">${seg("bf", [["open", "ยังไม่จบ"], ["all", "ทั้งหมด"]], filter)}<input class="search" id="bs" placeholder="ค้นหาชื่อ เบอร์ เลขสัญญา หรือคันที่"></div>
  ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>รถ</th><th>ลูกค้า</th><th>ช่วงเวลา</th><th>สถานะ</th><th class="num">ค้างจ่าย</th></tr></thead>
  <tbody>${rows.map((b) => `<tr data-href="#booking/${b.id}" style="cursor:pointer" data-q="${esc([b.contract_no, b.customer_name, b.customer_phone, "คันที่ " + b.car_no, b.car_plate].join(" ").toLowerCase())}">
    <td>${plate(carById(b.car_id), true)}</td>
    <td><a href="#booking/${b.id}"><b>${esc(b.customer_name || KIND_TH[b.kind])}</b></a><div class="small muted">${esc(b.contract_no || "")}</div></td>
    <td>${thDate(b.start_date)} ถึง ${thDate(b.end_date)}<div class="small muted">${KIND_TH[b.kind]} ${b.units} ${b.kind === "monthly" ? "เดือน" : "วัน"}</div></td>
    <td>${pill(b.kind === "monthly" && b.status === "active" ? "monthly" : b.status, STATUS_TH[b.status])}</td>
    <td class="num">${b.kind === "maintenance" ? "" : b.outstanding ? `<b style="color:var(--bad)">${baht(b.outstanding)}</b>` : "ครบแล้ว"}</td></tr>`).join("")}
  </tbody></table></div>` : '<div class="empty">ยังไม่มีการจอง กด "+ จองใหม่" หรือแตะช่องว่างในปฏิทินรถ</div>'}`;
  bindSeg(main, "bf", "bkFilter");
  main.querySelector("#bs").addEventListener("input", (e) => {
    const v = e.target.value.trim().toLowerCase();
    main.querySelectorAll("tbody tr").forEach((tr) => { tr.hidden = v && !tr.dataset.q.includes(v); });
  });
  main.querySelector("tbody")?.addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-href]");
    if (tr && !e.target.closest("a")) go(tr.dataset.href);
  });
  main.querySelector("[data-new]").addEventListener("click", () => bookingForm({}));
};

// ---------------------------------------------------------------- การจอง: ฟอร์มสร้างใหม่
async function bookingForm({ request = null, carId = null, start = null, customer = null }) {
  const st = S.settings;
  const kind0 = request ? request.plan : "daily";
  const start0 = start || (request && request.start_date) || today();
  const carFromReq = request && request.car_no ? (S.cars.find((c) => c.no === request.car_no) || {}).id : null;
  const carOpts = S.cars.filter((c) => c.active).map((c) => `<option value="${c.id}">คันที่ ${c.no} ${esc(colorName(c.color))}${c.plate ? " (" + esc(c.plate) + ")" : ""}</option>`).join("");
  const body = openModal(`
  <h2>${request ? "จองให้ " + esc(request.name || request.phone) : "จองใหม่"}</h2>
  <form class="form" id="bk">
    <div class="two">
      <label class="f"><span>รถ</span><select name="car_id" required>${carOpts}</select></label>
      <label class="f"><span>แบบการเช่า</span><select name="kind"><option value="daily">รายวัน</option><option value="monthly">รายเดือน</option><option value="maintenance">ปิดรถซ่อม / ใช้เอง</option></select></label>
    </div>
    <div class="two">
      <label class="f"><span>วันรับรถ</span><input name="start_date" type="date" required value="${esc(start0)}"></label>
      <label class="f" data-for="daily"><span>วันคืนรถ</span><input name="end_date" type="date"></label>
      <label class="f" data-for="monthly"><span>จำนวนเดือน</span><input name="months" type="number" min="1" max="60" value="${esc((request && request.months) || st.min_months)}">ขั้นต่ำ ${st.min_months} เดือน</label>
    </div>
    <fieldset data-for="customer">
      <legend>ลูกค้า</legend>
      <input id="cs" placeholder="ค้นหาลูกค้าเดิมจากชื่อหรือเบอร์โทร" autocomplete="off">
      <div id="cs-results" class="list" style="margin-top:8px"></div>
      <input type="hidden" name="customer_id">
      <div class="two" style="margin-top:10px" data-newcust>
        <label class="f"><span>ลูกค้าใหม่: ชื่อ-สกุล</span><input name="new_name" value="${esc((request && request.name) || "")}"></label>
        <label class="f"><span>เบอร์โทร</span><input name="new_phone" inputmode="tel" value="${esc((request && request.phone) || "")}"></label>
      </div>
    </fieldset>
    <div class="two" data-for="price">
      <label class="f"><span>ราคาต่อ<span data-unit>วัน</span> (บาท)</span><input name="unit_price" type="number" min="0" ${isOwner() ? "" : "disabled"}></label>
      <label class="f"><span>ส่วนลดรวม (บาท)</span><input name="discount" type="number" min="0" value="0" ${isOwner() ? "" : "disabled"}></label>
    </div>
    <div class="two" data-for="price">
      <label class="f"><span>เงินประกัน (บาท)</span><input name="deposit" type="number" min="0" value="0">คืนในวันที่คืนรถ</label>
      <label class="f"><span>สถานะ</span><select name="status"><option value="hold">รอยืนยัน (ยังไม่ได้มัดจำ)</option><option value="confirmed">ยืนยันแล้ว</option></select></label>
    </div>
    <label class="f"><span>หมายเหตุ</span><textarea name="note">${esc((request && request.note) || "")}</textarea></label>
    ${isOwner() ? "" : '<p class="hint">ราคาเป็นราคามาตรฐาน ถ้าต้องให้ส่วนลด ให้เจ้าของแก้</p>'}
    <div class="row"><span class="total" id="bk-total"></span><span class="spacer"></span>
      <button type="button" class="btn" data-close>ยกเลิก</button><button class="btn primary">บันทึกการจอง</button></div>
  </form>`);
  const f = body.querySelector("#bk");
  f.car_id.value = carId || carFromReq || f.car_id.value;
  f.kind.value = kind0;
  if (request && request.plan === "daily") f.end_date.value = addDays(start0, Math.max(1, request.days || 1) - 1);
  const sync = () => {
    const k = f.kind.value;
    body.querySelector('[data-for="daily"]').hidden = k === "monthly";
    body.querySelector('[data-for="monthly"]').hidden = k !== "monthly";
    body.querySelector('[data-for="customer"]').hidden = k === "maintenance";
    body.querySelectorAll('[data-for="price"]').forEach((el) => { el.hidden = k === "maintenance"; });
    body.querySelector("[data-unit]").textContent = k === "monthly" ? "เดือน" : "วัน";
    if (!f.unit_price.dataset.touched || !isOwner()) f.unit_price.value = k === "monthly" ? st.monthly_price : st.daily_price;
    if (!f.end_date.value || f.end_date.value < f.start_date.value) f.end_date.value = f.start_date.value;
    const p = bookingPeriod(k, f.start_date.value, { end: f.end_date.value, months: f.months.value });
    body.querySelector("#bk-total").textContent = k === "maintenance"
      ? `ปิดรถ ${p.units} วัน ถึง ${thDate(p.end)}`
      : `${p.units} ${k === "monthly" ? "เดือน" : "วัน"} คืนรถ ${thDate(p.end)} รวม ${baht(bookingTotal(f.unit_price.value, p.units, f.discount.value))} บาท`;
  };
  f.unit_price.addEventListener("input", () => { f.unit_price.dataset.touched = "1"; });
  f.addEventListener("input", sync);
  f.kind.addEventListener("change", () => { delete f.unit_price.dataset.touched; sync(); });
  sync();

  const cs = body.querySelector("#cs"), out = body.querySelector("#cs-results"), newc = body.querySelector("[data-newcust]");
  let timer;
  const pick = (c) => {
    f.customer_id.value = c.id;
    newc.hidden = true;
    out.innerHTML = `<div class="item row"><b>${esc(c.full_name)}</b><span class="meta">${esc(c.phone || "")}</span><span class="spacer"></span><button type="button" class="btn small" data-clear>เปลี่ยน</button></div>`;
    out.querySelector("[data-clear]").addEventListener("click", () => { f.customer_id.value = ""; out.innerHTML = ""; newc.hidden = false; });
  };
  const search = async (term) => {
    const t = term.replace(/[%,()]/g, " ").trim();
    if (t.length < 2) { out.innerHTML = ""; return; }
    const digits = normPhone(t);
    const rows = await q(sb.from("customers").select("id,full_name,phone").is("erased_at", null)
      .or(`full_name.ilike.%${t}%${digits.length >= 3 ? `,phone.ilike.%${digits}%` : ""}`).limit(8));
    out.innerHTML = rows.map((c) => `<button type="button" class="btn small" data-c="${c.id}">${esc(c.full_name)} ${esc(c.phone || "")}</button>`).join(" ") || '<span class="hint">ไม่พบ กรอกเป็นลูกค้าใหม่ด้านล่าง</span>';
    out.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => pick(rows.find((c) => c.id === Number(b.dataset.c)))));
  };
  cs.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(cs.value).catch(fail), 250); });
  if (customer) pick(customer);
  else if (request && request.customer_id) {
    const c = await q(sb.from("customers").select("id,full_name,phone").eq("id", request.customer_id).maybeSingle());
    if (c) pick(c);
  } else if (request && request.phone) {
    const found = await q(sb.from("customers").select("id,full_name,phone").eq("phone", request.phone).is("erased_at", null).limit(1));
    if (found.length) pick(found[0]);
  }

  f.addEventListener("submit", (e) => {
    e.preventDefault();
    withBusy(f.querySelector(".primary"), async () => {
      const v = formData(f);
      const k = f.kind.value;
      let customerId = v.customer_id ? Number(v.customer_id) : null;
      if (k !== "maintenance" && !customerId) {
        if (!v.new_name.trim()) { toast("เลือกลูกค้าเดิม หรือกรอกชื่อลูกค้าใหม่", true); return; }
        if (v.new_phone && !validPhone(v.new_phone)) { toast("เบอร์โทรไม่ถูกต้อง", true); return; }
        const phone = normPhone(v.new_phone) || null;
        const dup = phone ? await q(sb.from("customers").select("id").eq("phone", phone).is("erased_at", null).limit(1)) : [];
        customerId = dup.length ? dup[0].id
          : (await q(sb.from("customers").insert({ full_name: v.new_name.trim(), phone, source: "admin" }).select("id").single())).id;
      }
      const p = bookingPeriod(k, v.start_date, { end: v.end_date, months: v.months });
      const row = {
        car_id: Number(v.car_id), kind: k, customer_id: k === "maintenance" ? null : customerId,
        start_date: v.start_date, end_date: p.end, units: p.units, status: v.status || "hold",
        unit_price: Number(f.unit_price.value) || 0, discount: Number(f.discount.value) || 0, deposit: Number(v.deposit) || 0,
        note: v.note || null, request_id: request && request.id ? request.id : null,
      };
      const saved = await q(sb.from("bookings").insert(row).select("id").single());
      if (request && request.id) {
        await q(sb.from("booking_requests").update({ status: "converted", handled_by: S.session.user.id, handled_at: new Date().toISOString() }).eq("id", request.id));
      }
      closeModal();
      toast("บันทึกการจองแล้ว");
      scheduleRebuild();
      go("#booking/" + saved.id);
    });
  });
}

// ---------------------------------------------------------------- การจอง: รายละเอียด

    <div class="sub">${esc(b.contract_no || "")} ${pill(b.kind === "monthly" && b.status === "active" ? "monthly" : b.status, STATUS_TH[b.status])}</div></div>
    <div class="actions no-print">${customer ? callBtn(customer.phone) : ""}${b.kind !== "maintenance" ? '<button class="btn small" data-copy>คัดลอกสรุปส่ง LINE</button>' : ""}</div></div>

    <dl class="kv">
      <dt>รับรถ</dt><dd>${thDate(b.start_date)}${b.pickup_at ? `<div class="meta">ส่งจริง ${thDateTime(b.pickup_at)}${b.pickup_km ? `, ${baht(b.pickup_km)} กม.` : ""}${b.pickup_battery != null ? `, แบต ${b.pickup_battery}%` : ""}</div>` : ""}</dd>
      <dt>คืนรถ</dt><dd>${thDate(b.end_date)}${b.return_at ? `<div class="meta">คืนจริง ${thDateTime(b.return_at)}${b.return_km ? `, ${baht(b.return_km)} กม.` : ""}${b.return_battery != null ? `, แบต ${b.return_battery}%` : ""}</div>` : ""}</dd>
      ${customer ? `<dt>ลูกค้า</dt><dd><a href="#customer/${customer.id}">${esc(customer.full_name)}</a>${customer.phone ? `<div class="meta">${esc(customer.phone)}</div>` : ""}</dd>` : ""}
      ${b.kind !== "maintenance" ? `<dt>ค่าเช่า</dt><dd>${baht(b.unit_price)} × ${b.units} ${unit}${b.discount ? ` ลด ${baht(b.discount)}` : ""} = <b>${baht(b.total_price)}</b> บาท</dd>` : ""}

      <div><span>ค่าเช่ารวม</span><b>${baht(b.total_price)}</b></div>
      <div class="ok"><span>จ่ายแล้ว</span><b>${baht(b.paid_rent)}</b></div>

  </div>

    <span class="spacer"></span><button class="btn" data-edit>แก้ไข</button>${isOwner() ? '<button class="btn danger" data-del>ลบ</button>' : ""}
  </div>
  ${b.kind !== "maintenance" ? `

  ${pays.map((p) => `<tr data-p="${p.id}"><td><b>${esc(PAY_KIND_TH[p.kind])}</b>${p.note ? `<div class="small muted">${esc(p.note)}</div>` : ""}</td>
    <td class="${p.status === "due" && p.due_date && p.due_date < today() ? "late" : ""}">${thDate(p.due_date)}</td>
    <td>${pill(p.status, PAY_STATUS_TH[p.status])}${p.paid_at ? `<div class="small muted">${thDateTime(p.paid_at)} ${esc(METHOD_TH[p.method] || "")}</div>` : ""}</td>
    <td class="num"><b>${p.kind === "deposit_refund" ? "−" : ""}${baht(p.amount)}</b></td>
    <td class="no-print"><div class="row" style="justify-content:flex-end">${p.status === "due" ? '<button class="btn small brand" data-pay>รับเงิน</button>' : ""}
      ${p.slip_path ? '<button class="btn small" data-slip>สลิป</button>' : ""}
      ${isOwner() && p.status !== "void" ? '<button class="btn small danger" data-void>ยกเลิก</button>' : ""}</div></td></tr>`).join("")
    || '<tr><td colspan="5" class="muted">ยังไม่มีรายการ พอกด "ยืนยันการจอง" ระบบจะสร้างงวดค่าเช่าให้</td></tr>'}
  </tbody></table></div>
  <div class="row no-print" style="margin-top:10px"><button class="btn" data-addpay>+ บันทึกรับ/จ่ายเงิน</button></div>` : ""}`;

  const reload = () => route();
  main.addEventListener("click", async (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.copy !== undefined) {
      navigator.clipboard.writeText(bookingSummary(b, { colorName })).then(() => toast("คัดลอกแล้ว วางในแชต LINE ได้เลย"), fail);
    } else if (t.dataset.status) {
      statusDialog(b, t.dataset.status, reload);
    } else if (t.dataset.edit !== undefined) {
      editBookingDialog(b, reload);
    } else if (t.dataset.del !== undefined) {
      if (!(await ask("ลบการจองนี้ถาวร? ถ้าลูกค้าแค่ไม่เช่าแล้ว ให้กดยกเลิกการจองแทน", { danger: true, ok: "ลบถาวร" }))) return;
      withBusy(t, async () => { await q(sb.from("bookings").delete().eq("id", b.id)); scheduleRebuild(); go("#bookings"); });
    } else if (t.dataset.addpay !== undefined) {
      payDialog(b, null, reload);
    } else {
      const pid = Number(t.closest("[data-p]")?.dataset.p);
      const p = pays.find((x) => x.id === pid);
      if (!p) return;
      if (t.dataset.pay !== undefined) payDialog(b, p, reload);
      if (t.dataset.slip !== undefined) openFile(p.slip_path);
      if (t.dataset.void !== undefined && await ask("ยกเลิกรายการเงินนี้?", { danger: true, ok: "ยกเลิกรายการ" })) {
        withBusy(t, async () => { await q(sb.from("payments").update({ status: "void" }).eq("id", p.id)); reload(); });
      }
    }
  });
};

function statusDialog(b, status, done) {
  const extra = status === "active"
    ? `<div class="two"><label class="f"><span>เลขไมล์ตอนส่ง (กม.)</span><input name="pickup_km" type="number" min="0" inputmode="numeric"></label>
       <label class="f"><span>แบตตอนส่ง (%)</span><input name="pickup_battery" type="number" min="0" max="100" inputmode="numeric"></label></div>`
    : status === "returned"
      ? `<div class="two"><label class="f"><span>เลขไมล์ตอนคืน (กม.)</span><input name="return_km" type="number" min="0" inputmode="numeric"></label>
         <label class="f"><span>แบตตอนคืน (%)</span><input name="return_battery" type="number" min="0" max="100" inputmode="numeric"></label></div>
         <label class="f"><span>ความเสียหาย</span><textarea name="damage_note" placeholder="ถ้ามี ระบุและถ่ายรูปเก็บไว้"></textarea></label>
         <p class="hint">คืนเงินประกันในวันที่คืนรถ ถ้ามีความเสียหาย บันทึก "ค่าเสียหาย" แล้วคืนส่วนที่เหลือ</p>`
      : status === "cancelled" ? '<label class="f"><span>เหตุผลที่ยกเลิก</span><textarea name="note"></textarea></label>' : "";
  const title = { confirmed: "ยืนยันการจอง", active: "ส่งรถให้ลูกค้า", returned: "รับรถคืน", cancelled: "ยกเลิกการจอง", hold: "กลับเป็นรอยืนยัน" }[status];
  const body = openModal(`<h2>${title}</h2><form class="form" id="st">${extra}
    ${status === "confirmed" ? `<p class="hint">ระบบจะสร้างงวดค่าเช่าที่ต้องเก็บ${b.deposit ? " และเงินประกัน" : ""}ให้ โดยหักมัดจำจองที่รับแล้ว</p>` : ""}
    ${formFoot(title)}</form>`);
  const f = body.querySelector("#st");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    withBusy(f.querySelector(".primary"), async () => {
      const v = formData(f);
      const patch = { status };
      for (const k of ["pickup_km", "pickup_battery", "return_km", "return_battery"]) if (v[k]) patch[k] = Number(v[k]);
      if (v.damage_note) patch.damage_note = v.damage_note;
      if (v.note) patch.note = [b.note, "ยกเลิก: " + v.note].filter(Boolean).join("\n");
      await q(sb.from("bookings").update(patch).eq("id", b.id));
      closeModal(); toast(title + "แล้ว"); scheduleRebuild(); done();
    });
  });
}

function editBookingDialog(b, done) {
  const body = openModal(`<h2>แก้ไขการจอง</h2><form class="form" id="eb">
    <div class="two"><label class="f"><span>วันรับรถ</span><input name="start_date" type="date" value="${esc(b.start_date)}" required></label>
      ${b.kind === "monthly"
        ? `<label class="f"><span>จำนวนเดือน</span><input name="units" type="number" min="1" value="${b.units}"></label>`
        : `<label class="f"><span>วันคืนรถ</span><input name="end_date" type="date" value="${esc(b.end_date)}"></label>`}</div>
    ${b.kind !== "maintenance" ? `<div class="two"><label class="f"><span>ราคาต่อหน่วย</span><input name="unit_price" type="number" min="0" value="${b.unit_price}" ${isOwner() ? "" : "disabled"}></label>
      <label class="f"><span>ส่วนลดรวม</span><input name="discount" type="number" min="0" value="${b.discount}" ${isOwner() ? "" : "disabled"}></label></div>
      <label class="f"><span>เงินประกัน</span><input name="deposit" type="number" min="0" value="${b.deposit}"></label>` : ""}
    <label class="f"><span>หมายเหตุ</span><textarea name="note">${esc(b.note || "")}</textarea></label>
    <p class="hint">ต่อสัญญารายเดือนหลังยืนยันแล้ว ให้เพิ่มงวดเองที่ "บันทึกรับ/จ่ายเงิน"</p>
    ${formFoot("บันทึก")}</form>`);
  const f = body.querySelector("#eb");

    e.preventDefault();
    withBusy(f.querySelector(".primary"), async () => {
      const v = formData(f);
      const patch = { start_date: v.start_date, note: v.note || null };
      if (b.kind === "monthly") patch.units = Number(v.units) || b.units;
      else patch.end_date = v.end_date && v.end_date >= v.start_date ? v.end_date : v.start_date;
      if (b.kind !== "maintenance") {

        if (isOwner()) { patch.unit_price = Number(v.unit_price) || 0; patch.discount = Number(v.discount) || 0; }
      }

      closeModal(); toast("บันทึกแล้ว"); scheduleRebuild(); done();
    });
  });
}

function payDialog(b, due, done) {
  const kinds = due ? [due.kind] : ["reservation", "rent", "deposit", "deposit_refund", "damage", "other"];
  const body = openModal(`<h2>${due ? "รับเงิน " + esc(PAY_KIND_TH[due.kind]) + " " + baht(due.amount) + " บาท" : "บันทึกรับ/จ่ายเงิน"}</h2><form class="form" id="py">
    <div class="two">
      <label class="f"><span>รายการ</span><select name="kind" ${due ? "disabled" : ""}>${kinds.map((k) => `<option value="${k}">${PAY_KIND_TH[k]}</option>`).join("")}</select></label>
      <label class="f"><span>จำนวนเงิน (บาท)</span><input name="amount" type="number" min="1" inputmode="numeric" required value="${due ? due.amount : ""}" ${due ? "disabled" : ""}></label>
    </div>
    <div class="two">
      <label class="f"><span>วิธีจ่าย</span><select name="method">${Object.entries(METHOD_TH).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
      <label class="f"><span>สลิป</span><input name="slip" type="file" accept="image/*,application/pdf">ถ่ายรูปหรือเลือกไฟล์</label>
    </div>
    <label class="f"><span>หมายเหตุ</span><input name="note" value="${esc(due ? due.note || "" : "")}"></label>
    ${due ? "" : '<p class="hint">"คืนเงินประกัน" คือเงินที่ร้านจ่ายคืนลูกค้า ใส่จำนวนเป็นบวก</p>'}
    ${formFoot(due ? "รับเงินแล้ว" : "บันทึก")}</form>`);
  const f = body.querySelector("#py");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    withBusy(f.querySelector(".primary"), async () => {
      const file = f.slip.files[0];
      const slip = file ? await upload(`slips/${b.id}`, file) : null;
      const common = { method: f.method.value, note: f.note.value || null, slip_path: slip };
      if (due) await q(sb.from("payments").update({ ...common, status: "paid", slip_path: slip || due.slip_path }).eq("id", due.id));
      else await q(sb.from("payments").insert({ ...common, booking_id: b.id, kind: f.kind.value, amount: Number(f.amount.value), status: "paid" }));
      closeModal(); toast("บันทึกเงินแล้ว"); done();
    });
  });
}

VIEWS.payments = async function payments(main) {
  const rows = await q(sb.from("v_payments_due").select("*").order("due_date").limit(500));
  const t = today();
  const late = rows.filter((p) => p.due_date && p.due_date < t);
  const soon = rows.filter((p) => p.due_date && p.due_date >= t && p.due_date <= addDays(t, 7));
  const sum = (xs) => baht(xs.reduce((s, p) => s + p.amount, 0));
  main.innerHTML = `<div class="page-head"><div><h1>เงินที่ต้องเก็บ</h1><div class="sub">งวดค่าเช่าและเงินประกันที่ยังไม่ได้รับ</div></div></div>
    <div class="money-strip" style="margin:0 0 18px"><div class="owe"><span>เลยกำหนด ${late.length} รายการ</span><b>${sum(late)}</b></div>
      <div><span>ครบใน 7 วัน ${soon.length} รายการ</span><b>${sum(soon)}</b></div><div><span>ค้างทั้งหมด ${rows.length} รายการ</span><b>${sum(rows)}</b></div></div>
    ${dueTable(rows)}`;
};

  main.querySelector("[data-book]")?.addEventListener("click", () => bookingForm({ customer: c }));
  const up = main.querySelector("#up");
  up?.addEventListener("submit", (e) => {
    e.preventDefault();
    withBusy(up.querySelector("button"), async () => {
      const path = await upload(`customers/${c.id}`, up.file.files[0]);
      await q(sb.from("customer_documents").insert({ customer_id: c.id, kind: up.kind.value, storage_path: path }));
      toast("อัปโหลดแล้ว"); route();
    });
  });
  main.addEventListener("click", async (e) => {
    const row = e.target.closest("[data-doc]");
    if (!row) return;
    const d = docs.find((x) => x.id === Number(row.dataset.doc));
    if (e.target.closest("[data-open]")) openFile(d.storage_path);
    if (e.target.closest("[data-deldoc]") && await ask("ลบเอกสารนี้ถาวร?", { danger: true, ok: "ลบถาวร" })) withBusy(e.target, async () => { await deleteDocs([d]); route(); });
  });
  main.querySelector("[data-erase]")?.addEventListener("click", async (e) => {
    if (!(await ask(`ลบข้อมูลส่วนบุคคลของ "${c.full_name}" และไฟล์เอกสารทั้งหมดถาวร? ประวัติการเช่าและยอดเงินยังอยู่แบบไม่มีชื่อ`, { danger: true, ok: "ลบข้อมูล" }))) return;
    withBusy(e.target, async () => {
      await q(sb.rpc("erase_customer", { p_customer_id: c.id }));
      await deleteDocs(docs);
      toast("ลบข้อมูลแล้ว"); route();
    });
  });
};

async function deleteDocs(docs) {
  if (!docs.length) return;
  await q(sb.storage.from("private-docs").remove(docs.map((d) => d.storage_path)));
  await q(sb.from("customer_documents").delete().in("id", docs.map((d) => d.id)));
}

  const ACT_TH = { insert: "เพิ่ม", update: "แก้", delete: "ลบ" };
  main.innerHTML = `<div class="page-head"><div><h1>ตั้งค่า</h1><div class="sub">ราคา เอกสาร และประวัติการแก้ไข</div></div></div>
  <form class="card form" id="stf">
    <div class="two"><label class="f"><span>ราคารายวัน (บาท)</span><input name="daily_price" type="number" min="1" value="${st.daily_price}"></label>
      <label class="f"><span>ราคารายเดือน (บาท)</span><input name="monthly_price" type="number" min="1" value="${st.monthly_price}"></label></div>
    <div class="two"><label class="f"><span>สัญญารายเดือนขั้นต่ำ (เดือน)</span><input name="min_months" type="number" min="1" max="36" value="${st.min_months}"></label>
      <label class="f"><span>มัดจำจอง (บาท)</span><input name="reservation_fee" type="number" min="0" value="${st.reservation_fee}"></label></div>
    <label class="f"><span>ลบรูปเอกสารลูกค้าหลังสัญญาสุดท้ายจบ (วัน)</span><input name="doc_retention_days" type="number" min="1" max="3650" value="${st.doc_retention_days}"></label>
    <p class="hint">ราคาที่นี่ใช้ในหลังบ้าน ราคาบนหน้าเว็บอยู่ใน site.config.json</p>
    <div class="row"><span class="spacer"></span><button class="btn primary">บันทึกตั้งค่า</button></div>
  </form>
  <h2>หน้าเว็บ</h2>
  <div class="card row"><span>ปฏิทินรถว่างบนเว็บอัปเดตเองหลังแก้การจอง</span><span class="spacer"></span><button class="btn" data-rebuild>อัปเดตเว็บตอนนี้</button></div>
  <h2>PDPA</h2>
  <div class="card"><b>รูปเอกสารที่ครบกำหนดลบ ${dueDocs.length} ไฟล์</b>
    <div class="list" style="margin-top:8px">${dueDocs.map((d) => `<div class="meta">${esc(d.customer_name)}: ${esc(DOC_KIND_TH[d.kind])} ครบกำหนด ${thDate(d.delete_after)}</div>`).join("")}</div>
    ${dueDocs.length ? '<button class="btn danger" style="margin-top:10px" data-purge>ลบเอกสารที่ครบกำหนดทั้งหมด</button>' : ""}</div>
  <div class="card"><b>คนที่ทักมาแต่ไม่ได้เช่าเกิน 180 วัน ${stale.length} คน</b>
    <div class="list" style="margin-top:8px">${stale.map((s) => `<div class="meta">${esc(s.full_name)} ${esc(SOURCE_TH[s.source] || "")} เมื่อ ${thDate(s.created_at)}</div>`).join("")}</div>
    ${stale.length ? '<button class="btn danger" style="margin-top:10px" data-stale>ลบรายชื่อเหล่านี้</button>' : ""}</div>
  <h2>ประวัติการแก้ไขล่าสุด</h2>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>เวลา</th><th>ใคร</th><th>ทำอะไร</th></tr></thead><tbody>
  ${audit.map((a) => `<tr><td class="small">${thDateTime(a.at)}</td><td>${esc(a.actor_name)}</td><td>${ACT_TH[a.action] || esc(a.action)}${TBL_TH[a.tbl] || esc(a.tbl)} #${esc(a.row_id)}
    ${a.action === "update" && a.old_row && a.new_row ? `<div class="small muted">${esc(Object.keys(a.new_row).filter((k) => k !== "updated_at" && JSON.stringify(a.old_row[k]) !== JSON.stringify(a.new_row[k])).slice(0, 4).join(", "))}</div>` : ""}</td></tr>`).join("")}
  </tbody></table></div>`;
  const f = main.querySelector("#stf");
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    withBusy(f.querySelector(".primary"), async () => {
      const v = formData(f);
      S.settings = await q(sb.from("settings").update(Object.fromEntries(Object.entries(v).map(([k, x]) => [k, Number(x)]))).eq("id", true).select().single());
      toast("บันทึกตั้งค่าแล้ว");
    });
  });
  main.querySelector("[data-rebuild]").addEventListener("click", (e) => withBusy(e.target, () => rebuildNow(true)));
  main.querySelector("[data-purge]")?.addEventListener("click", async (e) => {
    if (!(await ask(`ลบเอกสาร ${dueDocs.length} ไฟล์ถาวร?`, { danger: true, ok: "ลบถาวร" }))) return;
    withBusy(e.target, async () => { await deleteDocs(dueDocs); toast("ลบแล้ว"); route(); });
  });
  main.querySelector("[data-stale]")?.addEventListener("click", async (e) => {
    if (!(await ask(`ลบรายชื่อ ${stale.length} คนที่ไม่เคยเช่าถาวร?`, { danger: true, ok: "ลบถาวร" }))) return;
    withBusy(e.target, async () => { await q(sb.from("customers").delete().in("id", stale.map((s) => s.id))); toast("ลบแล้ว"); route(); });
  });
};

// ---------------------------------------------------------------- เริ่มทำงาน
let realtime = null;
async function start(session) {
  S.session = session;
  if (!session) {
    S.me = null;
    if (realtime) { sb.removeChannel(realtime); realtime = null; }
    renderLogin();
    return;
  }
  try {
    S.me = await loadMe();
  } catch (e) { fail(e); renderLogin(errMsg(e)); return; }
  if (!S.me) {
    app.innerHTML = `<div class="login-wrap"><div class="login"><h1>บัญชีนี้ยังไม่มีสิทธิ์</h1><p>${esc(session.user.email)} ยังไม่ได้รับสิทธิ์เข้าระบบหลังบ้าน ให้เจ้าของเชิญในเมนูพนักงาน</p>
      <button class="btn" id="lo">ออกจากระบบ</button></div></div>`;
    document.getElementById("lo").addEventListener("click", () => sb.auth.signOut());
    return;
  }
  if (/access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search + "#dashboard");
  await route();
  if (NEEDS_PASSWORD) askNewPassword();
  if (!realtime) {
    realtime = sb.channel("requests").on("postgres_changes", { event: "INSERT", schema: "public", table: "booking_requests" }, (p) => {
      if (p.new && p.new.status === "new") {
        toast(`คำขอจองใหม่จาก ${p.new.name || p.new.phone || "เว็บ"}`);
        refreshBadge();
        if (location.hash.startsWith("#requests") || location.hash.startsWith("#dashboard")) route();
      }
    }).subscribe();
  }
}

window.addEventListener("hashchange", () => { if (S.me && !/access_token/.test(location.hash)) route(); });
let lastUser;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session ? session.user.id : null;
  if (event === "PASSWORD_RECOVERY") setTimeout(askNewPassword, 300);
  if (uid === lastUser && event !== "INITIAL_SESSION") return;
  lastUser = uid;
  setTimeout(() => start(session), 0);
});

})();
</script>
</body>
</html>
